name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Includes integration tests against PostgreSQL 18 through Testcontainers.
      - run: sh ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  full-stack:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create throwaway environment file
        run: |
          {
            echo "DB_NAME=family_health"
            echo "DB_USERNAME=family_health"
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
          } > .env
      - name: Build images and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Page is served through nginx
        run: curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
      - name: Backend and database are reachable through nginx
        run: curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
      - name: Other actuator endpoints are not reachable through nginx
        run: |
          # The SPA fallback answers unknown paths with index.html, never with actuator data.
          ! curl -sS http://127.0.0.1:8080/actuator/env | grep -q 'propertySources'
      - name: Register, log in, read the account, and log out through nginx
        run: |
          set -eu
          base=http://127.0.0.1:8080/api/v1/auth
          jar=$(mktemp)
          email="ci-$(openssl rand -hex 6)@example.test"
          password="$(openssl rand -hex 16)"
          csrf() { curl -fsS -b "$jar" -c "$jar" "$base/csrf" | jq -r .token; }
          post() { curl -fsS -o /dev/null -b "$jar" -c "$jar" -H 'Content-Type: application/json' -H "X-CSRF-TOKEN: $(csrf)" -d "$2" "$base/$1"; }

          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/me")" = 401
          post register "{\"email\":\"$email\",\"password\":\"$password\",\"displayName\":\"CI\"}"
          post login "{\"email\":\"$email\",\"password\":\"$password\"}"
          curl -fsS -b "$jar" "$base/me" | jq -e --arg email "$email" '.email == $email'
          post logout '{}'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$jar" "$base/me")" = 401
      - name: Show container status on failure
        if: failure()
        run: docker compose ps --all
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
