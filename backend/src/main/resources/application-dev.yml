# Local development against the Windows PostgreSQL service. DB_PASSWORD has no default.
server:
  port: 8081
  servlet:
    session:
      cookie:
        # Local development runs over plain HTTP.
        secure: false

app:
  documents:
    # Relative to the backend folder, and ignored by Git.
    storage-dir: ${DOCUMENT_STORAGE_DIR:./data/documents}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/family_health_dev}
    username: ${DB_USERNAME:family_health_dev}
