spring:
  application:
    name: family-health-backend
  autoconfigure:
    # Accounts live in user_account. Without this, Boot logs a generated default password at startup.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    # Flyway owns the schema. Hibernate may only check it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # A little above app.documents.max-file-size, so the service reports an oversized file itself.
      max-file-size: 11MB
      max-request-size: 11MB
  session:
    jdbc:
      # Flyway owns these tables too.
      initialize-schema: never
  mail:
    # Gmail SMTP by default (DECISIONS.md, D-028). Username and app password from the environment only.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  # Trust X-Forwarded-* only from private addresses (nginx), so rate limits see the real client IP.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # Only local HTTP setups turn this off.
        secure: ${SESSION_COOKIE_SECURE:true}

app:
  # The address people use to open the app. Reset links and the Google redirect are built from it.
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  mail:
    # Defaults to MAIL_USERNAME.
    from: ${MAIL_FROM:}
    # Development only: when no mail account is set, or sending fails, write the message (and its link) to the log.
    log-when-unconfigured: false
    brevo:
      # When set, email goes through Brevo's HTTPS API instead of SMTP (D-033). MAIL_FROM is then the verified sender.
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_BASE_URL:https://api.brevo.com}
  proxy:
    # Set on a host behind the Cloudflare Pages proxy (D-033). Requests without it are refused, except the health check.
    secret: ${PROXY_SECRET:}
  password-reset:
    valid-for: 30m
    max-per-account-per-hour: 3
  oauth:
    google:
      # Both from the environment only. Without them, Google sign-in is hidden and off.
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  ai:
    # Calls must finish in this time. Retries are bounded by worker.max-attempts.
    timeout: 90s
    gemini:
      # From the environment only. Without a key, AI features report unavailable and manual entry still works.
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      # Used when the main model reports high demand (503), which happens often on the free tier.
      fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-flash-lite-latest}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    limits:
      # Over a rolling day. Protects a free or small budget.
      per-account-per-day: ${AI_LIMIT_PER_ACCOUNT_PER_DAY:20}
      global-per-day: ${AI_LIMIT_GLOBAL_PER_DAY:200}
    worker:
      enabled: true
      poll-interval: 3s
      max-attempts: 2
      stale-after: 5m
  documents:
    # Private folder for uploaded originals, outside anything the web server serves. Required unless a bucket is set.
    storage-dir: ${DOCUMENT_STORAGE_DIR:}
    max-file-size: 10MB
    s3:
      # When a bucket is set, files go to private S3-compatible storage (Cloudflare R2, D-033) instead of the folder above.
      bucket: ${STORAGE_BUCKET:}
      endpoint: ${STORAGE_ENDPOINT:}
      region: ${STORAGE_REGION:auto}
      access-key: ${STORAGE_ACCESS_KEY:}
      secret-key: ${STORAGE_SECRET_KEY:}
  session:
    absolute-timeout: 12h
  login-rate-limit:
    window: 15m
    max-failures-per-account: 10
    # Higher, because a classroom or household shares one address.
    max-failures-per-address: 50
  registration-rate-limit:
    # Per IP address (docs/06 section 2). Enough for a classroom sharing one address.
    window: 1h
    max-per-address: 20
  emergency-card:
    # Public card reads per IP address (docs/06 section 6). Found or not, every read counts.
    rate-limit:
      window: 1m
      max-per-address: 30

management:
  health:
    # Checking the mail server on every health probe would mark the app down when mail is offline.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
