spring:
  application:
    name: family-health-backend
  autoconfigure:
    # Accounts live in user_account. Without this, Boot logs a generated default password at startup.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    # Flyway owns the schema. Hibernate may only check it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # A little above app.documents.max-file-size, so the service reports an oversized file itself.
      max-file-size: 11MB
      max-request-size: 11MB
  session:
    jdbc:
      # Flyway owns these tables too.
      initialize-schema: never

server:
  # Trust X-Forwarded-* only from private addresses (nginx), so rate limits see the real client IP.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # Only local HTTP setups turn this off.
        secure: ${SESSION_COOKIE_SECURE:true}

app:
  ai:
    # Calls must finish in this time. Retries are bounded by worker.max-attempts.
    timeout: 90s
    gemini:
      # From the environment only. Without a key, AI features report unavailable and manual entry still works.
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-flash-latest}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    limits:
      # Over a rolling day. Protects a free or small budget.
      per-account-per-day: ${AI_LIMIT_PER_ACCOUNT_PER_DAY:20}
      global-per-day: ${AI_LIMIT_GLOBAL_PER_DAY:200}
    worker:
      enabled: true
      poll-interval: 3s
      max-attempts: 2
      stale-after: 5m
  documents:
    # Private folder for uploaded originals, outside anything the web server serves. Required.
    storage-dir: ${DOCUMENT_STORAGE_DIR:}
    max-file-size: 10MB
  session:
    absolute-timeout: 12h
  login-rate-limit:
    window: 15m
    max-failures-per-account: 10
    # Higher, because a classroom or household shares one address.
    max-failures-per-address: 50

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
